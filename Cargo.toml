[workspace]
members = ["audio", "engine", "gui"]
resolver = "2"

# Libraries (not our crates): optimised, with debug info for file and line numbers
# only, so backtraces still say where. Full debug info for every library made each
# build about three times the size on disk. Our own crates keep full debug info.
[profile.dev.package."*"]
opt-level = 2
debug = "line-tables-only"

[profile.dev.package.earshot-engine]
opt-level = 2

# Decoding and waveform/loudness measurement run on every load.
[profile.dev.package.earshot-audio]
opt-level = 2

# The egui app draws waveforms on the CPU every frame: keep it fast in dev builds too.
[profile.dev.package.earshot-gui]
opt-level = 2
