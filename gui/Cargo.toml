[package]
name = "earshot-gui"
version = "0.1.2"
license = "MIT"
edition = "2024"

# The package is earshot-gui (cargo -p earshot-gui); the program is just earshot.
[[bin]]
name = "earshot"
path = "src/main.rs"

[dependencies]
directories = "6.0.0"
earshot-engine = { version = "0.1.2", path = "../engine" }
eframe = { version = "0.33.3", features = ["persistence"] }
egui = "0.33.3"
egui_extras = "0.33.3"
# Debug mode: its zip export and spectrogram.
crc32fast = "1.5.2"
realfft = "3.5.1"
fontdb = { version = "0.23.0", default-features = false, features = [
    "fs",
    "memmap",
    "fontconfig",
] }
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "jpeg",
] }
midir = "0.11.0"
rfd = "0.17.2"
wmidi = "4.0.11"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.21"
object_store = { version = "0.14.2", default-features = false, features = ["aws"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "rt-multi-thread"] }
keyring = "4.2.0"
futures = { version = "0.3.34", default-features = false, features = ["std"] }
bytes = "1.12.2"

# Locking deck audio in RAM, reading drive free space, polling the mount table:
# used on macOS too, so libc is needed on every unix.
[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

# USB sticks on Windows (core/drives/windows.rs): which volumes are removable, their
# size and free space, flushing and ejecting them.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# A controller's own sound card: which ALSA card its MIDI port is on, and asking
# PipeWire to let go of it (the ReserveDevice1 D-Bus name).
alsa = "0.11.0"
zbus = "5.19.0"

[dev-dependencies]
egui_kittest = { version = "0.33.3", features = ["wgpu", "eframe", "snapshot"] }

[build-dependencies]
winresource = "0.1.34"
