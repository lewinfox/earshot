# A copy of signalsmith-stretch 0.1.3 (https://github.com/colinmarc/signalsmith-stretch-rs,
# MIT), with one addition: `Stretch::preset_default_split`, which turns on the C++
# library's own `splitComputation` (the published wrapper has no way to). See README.md
# here for what was changed and how to drop this copy again.
[package]
name = "signalsmith-stretch"
description = "A wrapper for the Signalsmith Stretch timestretch and pitch-shifting algorithm"
version = "0.1.3"
edition = "2021"
authors = ["Colin Marc <hi@colinmarc.com>"]
license = "MIT"
repository = "https://github.com/colinmarc/signalsmith-stretch-rs"

[dependencies]
dasp = "0.11"

[build-dependencies]
bindgen = "0.70"
cc = "1"
