[package]
name = "earshot"
version = "0.1.0"
edition = "2024"

[lib]
name = "earshot_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
earshot-engine = { path = "../../engine" }
midir = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "~2.11", features = [] }

[build-dependencies]
tauri-build = { version = "~2.6", features = [] }
