# What compiling earshot needs besides Rust, on whichever runner this is: ALSA and
# D-Bus for audio and real-time priority, PipeWire, libclang for the keylock
# library's bindings, the windowing libraries egui needs, and what building Rubber
# Band for the bundle needs. macOS needs nothing.
#
# On Linux, apt's package lists and the packages it downloads are cached, by runner
# image and this file, so a run that finds them skips `apt-get update` and the
# download (Ubuntu's mirror is sometimes slow): only installing them is left. Saved
# only when the caller says (cache.yml, warming on develop), like the other caches.
name: earshot build dependencies
description: The system packages compiling earshot needs
inputs:
  save-cache:
    description: Save apt's cache if it wasn't found ("true" when warming)
    default: "false"
runs:
  using: composite
  steps:
    - name: apt cache key
      id: apt
      if: runner.os == 'Linux'
      shell: bash
      run: |
        dir="$RUNNER_TEMP/apt"
        mkdir -p "$dir/archives/partial" "$dir/lists/partial"
        echo "dir=$dir" >> "$GITHUB_OUTPUT"
        echo "key=apt-$ImageOS-$ImageVersion-${{ hashFiles('.github/actions/build-deps/action.yml') }}" >> "$GITHUB_OUTPUT"

    - name: Restore apt's cache
      id: restore
      if: runner.os == 'Linux'
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.apt.outputs.dir }}
        key: ${{ steps.apt.outputs.key }}

    - name: Linux packages
      if: runner.os == 'Linux'
      shell: bash
      env:
        DIR: ${{ steps.apt.outputs.dir }}
        HIT: ${{ steps.restore.outputs.cache-hit }}
      run: |
        # apt's lists and downloads in the cached folder; downloading as root, as the
        # folder isn't _apt's. And no man page index rebuilt after installing.
        apt=(-o "Dir::State::Lists=$DIR/lists" -o "Dir::Cache::Archives=$DIR/archives"
          -o APT::Sandbox::User=root)
        sudo rm -f /var/lib/man-db/auto-update
        [[ "$HIT" == true ]] || sudo apt-get "${apt[@]}" update
        sudo apt-get "${apt[@]}" install -y --no-install-recommends \
          pkg-config libasound2-dev libdbus-1-dev libpipewire-0.3-dev libclang-dev \
          libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
          libxrandr-dev libxi-dev libgl1-mesa-dev \
          build-essential libsndfile1-dev
        # Readable for saving (apt leaves some of it root's only).
        sudo rm -f "$DIR/lists/lock" "$DIR/archives/lock"
        sudo chown -R "$(id -u):$(id -g)" "$DIR"

    - name: Save apt's cache
      if: runner.os == 'Linux' && inputs.save-cache == 'true' && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.apt.outputs.dir }}
        key: ${{ steps.apt.outputs.key }}

    # The runner has LLVM installed.
    - name: Windows libclang
      if: runner.os == 'Windows'
      shell: bash
      run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"
