# Keeps the build caches warm for ci.yml and release.yml. A run can only restore
# caches saved on its own branch or the default branch (develop), so after each merge
# into develop this compiles the tests and the release builds and installs the
# worker's packages (without running or packaging anything), and saves the caches
# every PR, branch and release tag starts from. The jobs are the same ones they use
# (rust-tests.yml, worker-tests.yml, build.yml), so the caches match.

name: cache

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Test cache
    uses: ./.github/workflows/rust-tests.yml
    with:
      warm-cache: true

  worker:
    name: Worker cache
    uses: ./.github/workflows/worker-tests.yml
    with:
      warm-cache: true

  release:
    name: Release cache
    uses: ./.github/workflows/build.yml
    with:
      warm-cache: true
