# Release builds. Pushing a tag like v1.2.3 builds earshot for Linux, macOS and
# Windows (build.yml) and attaches what it makes to a GitHub release for that tag.
# Running it by hand (Actions > release > Run workflow) builds the same files as
# downloadable artifacts, without a release, to check the builds still work.

name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit

  release:
    name: GitHub release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
