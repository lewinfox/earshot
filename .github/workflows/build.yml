# earshot's release build for Linux, macOS and Windows. Called by release.yml, which
# packages and uploads what it builds, and cache.yml, which only compiles and bundles
# it (warm-cache) and saves the caches release builds restore: the compiled Rust
# dependencies and what bundle.sh downloads.
#
# Each download is the app and everything it runs, ready to use: a Python with the
# worker's packages, the worker, the Beat This! models, ffmpeg and Rubber Band
# (packaging/bundle.sh), checked by packaging/smoke_test.py before it's uploaded.
# On macOS that's earshot.app in a disk image, signed and notarized
# (packaging/macos/package.sh); Linux gets a .deb and an .rpm
# (packaging/linux/package.sh) and the folder as an archive; Windows an installer
# (packaging/windows/package.sh, tried out by test_installer.sh). Windows is new and
# less tried, so a failure there doesn't stop the release.

name: build

on:
  workflow_call:
    inputs:
      warm-cache:
        description: Compile and bundle only, and save the caches (no smoke test, signing or upload)
        type: boolean
        default: false
    # The Apple signing ones; without them the Mac app is signed ad hoc.
    secrets:
      MACOS_CERTIFICATE:
      MACOS_CERTIFICATE_PASSWORD:
      NOTARY_KEY:
      NOTARY_KEY_ID:
      NOTARY_ISSUER:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # A build takes about 12 minutes; this only stops one that hangs.
    timeout-minutes: 90
    continue-on-error: ${{ matrix.name == 'windows-x86_64' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            # The oldest Ubuntu earshot's Linux packages support: glibc only runs what
            # was built against it or older, so build (and test) on the oldest.
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            exe: earshot
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            exe: earshot
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: earshot.exe

    steps:
      - uses: actions/checkout@v7

      # Not its own cache, which every run would save: the steps below keep uv's
      # cache, saved only when warming, like the others.
      - uses: astral-sh/setup-uv@v10.3.3 # exact versions only: it has no major-version tags
        with:
          enable-cache: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Saved only when warming (cache.yml, on develop, where every branch and tag can
      # read it); a cache saved by a release would only serve re-runs of that same
      # branch or tag. The runner is in the key: build scripts' output (PipeWire's
      # bindings) depends on its system headers.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          key: ${{ matrix.os }}
          save-if: ${{ inputs.warm-cache }}

      - uses: ./.github/actions/build-deps
        with:
          save-cache: ${{ inputs.warm-cache }}

      - name: Build
        run: cargo build --release --locked -p earshot-gui --target ${{ matrix.target }}

      # What bundle.sh downloads, restored like the Rust cache (saved only when
      # warming). The worker's packages: uv's cache, by worker/uv.lock, else the newest
      # older one (uv takes only what matches). Python, ffmpeg, Rubber Band and the
      # Beat This! checkpoints (packaging/.cache): by what bundle.sh and the worker's
      # detectors pin, and the month, as ffmpeg is its newest build.
      - name: Downloads cache keys
        id: downloads
        shell: bash
        run: |
          echo "UV_CACHE_DIR=$RUNNER_TEMP/uv-cache" >> "$GITHUB_ENV"
          echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore uv's cache
        id: uv-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ matrix.name }}-${{ hashFiles('worker/uv.lock') }}
          restore-keys: uv-${{ matrix.name }}-

      - name: Restore bundle downloads
        id: bundle-cache
        uses: actions/cache/restore@v6
        with:
          path: packaging/.cache
          key: bundle-${{ matrix.name }}-${{ steps.downloads.outputs.month }}-${{ hashFiles('packaging/bundle.sh', 'worker/earshot_worker/detectors.py') }}

      # Warming: bundle (the downloads), and save what it downloaded.
      - name: Bundle
        if: ${{ inputs.warm-cache }}
        shell: bash
        run: packaging/bundle.sh ${{ matrix.name }} "target/${{ matrix.target }}/release/${{ matrix.exe }}" "$RUNNER_TEMP/bundle"

      - name: Save uv's cache
        if: ${{ inputs.warm-cache && steps.uv-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: ${{ steps.uv-cache.outputs.cache-primary-key }}

      - name: Save bundle downloads
        if: ${{ inputs.warm-cache && steps.bundle-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: packaging/.cache
          key: ${{ steps.bundle-cache.outputs.cache-primary-key }}

      # The Developer ID certificate the Mac app is signed with, in a keychain of its
      # own, and the App Store Connect API key that notarizes it. Without these
      # secrets (a fork, say) the app is signed ad hoc and not notarized.
      - name: Apple signing
        if: ${{ runner.os == 'macOS' && !inputs.warm-cache }}
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          if [[ -n "$CERTIFICATE" ]]; then
            keychain="$RUNNER_TEMP/signing.keychain-db"
            password="$(uuidgen)"
            echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p "$password" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$password" "$keychain"
            # The certificate, its private key and Apple's intermediate certificate.
            security import "$RUNNER_TEMP/cert.p12" -P "$CERTIFICATE_PASSWORD" \
              -f pkcs12 -T /usr/bin/codesign -k "$keychain"
            security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            rm "$RUNNER_TEMP/cert.p12"
            identity=$(security find-identity -v -p codesigning "$keychain" |
              sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
            [[ -n "$identity" ]] || { echo "no Developer ID Application identity in MACOS_CERTIFICATE"; exit 1; }
            echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          fi
          if [[ -n "$NOTARY_KEY_P8" ]]; then
            echo "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"
            {
              echo "NOTARY_KEY=$RUNNER_TEMP/notary.p8"
              echo "NOTARY_KEY_ID=$NOTARY_KEY_ID"
              echo "NOTARY_ISSUER=$NOTARY_ISSUER"
            } >> "$GITHUB_ENV"
          fi

      # nfpm makes the .deb and .rpm (packaging/linux/package.sh), pinned and checked.
      # Keep NFPM_VERSION in step with package.sh's.
      - name: nfpm
        if: ${{ runner.os == 'Linux' && !inputs.warm-cache }}
        env:
          NFPM_VERSION: 2.48.0
        run: |
          f="nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          base="https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}"
          curl -fsSLO "$base/$f"
          curl -fsSL "$base/checksums.txt" | grep " $f\$" | sha256sum -c -
          tar xzf "$f" nfpm
          echo "NFPM=$PWD/nfpm" >> "$GITHUB_ENV"

      # Everything to upload goes in out/.
      - name: Package
        if: ${{ !inputs.warm-cache }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          [[ "$GITHUB_REF_TYPE" == tag ]] || version="dev-${GITHUB_SHA::7}"
          name="earshot-${version}-${{ matrix.name }}"
          # The installers' version suffix, for a build that isn't a release.
          dev=""
          [[ "$GITHUB_REF_TYPE" == tag ]] || dev="${GITHUB_SHA::7}"
          mkdir -p out
          packaging/bundle.sh ${{ matrix.name }} "target/${{ matrix.target }}/release/${{ matrix.exe }}" "$name"
          if [[ "$RUNNER_OS" == macOS ]]; then
            # The smoke test runs on the signed app, so it runs under the hardened
            # runtime as users will.
            packaging/macos/package.sh app "$name" app
            PYTHONDONTWRITEBYTECODE=1 app/earshot.app/Contents/Resources/python/bin/python3 packaging/smoke_test.py app/earshot.app/Contents/Resources
            packaging/macos/package.sh dmg app/earshot.app "out/$name.dmg"
          elif [[ "$RUNNER_OS" == Windows ]]; then
            "$name/python/python.exe" packaging/smoke_test.py "$name"
            packaging/windows/package.sh "$name" "out/$name-setup.exe" $dev
            packaging/windows/test_installer.sh "out/$name-setup.exe"
          else
            "$name/python/bin/python3" packaging/smoke_test.py "$name"
            XZ_OPT=-T0 tar cJf "out/$name.tar.xz" "$name"
            packaging/linux/package.sh "$name" out $dev
          fi

      # Each file as it is (archive: false), so the run's downloads are the .dmg, .deb
      # and so on rather than zips of them; that takes one file per upload.
      - name: Upload dmg
        if: ${{ !inputs.warm-cache && runner.os == 'macOS' }}
        uses: actions/upload-artifact@v7
        with:
          path: out/*.dmg
          archive: false
          if-no-files-found: error

      - name: Upload deb
        if: ${{ !inputs.warm-cache && runner.os == 'Linux' }}
        uses: actions/upload-artifact@v7
        with:
          path: out/*.deb
          archive: false
          if-no-files-found: error

      - name: Upload rpm
        if: ${{ !inputs.warm-cache && runner.os == 'Linux' }}
        uses: actions/upload-artifact@v7
        with:
          path: out/*.rpm
          archive: false
          if-no-files-found: error

      - name: Upload tar.xz
        if: ${{ !inputs.warm-cache && runner.os == 'Linux' }}
        uses: actions/upload-artifact@v7
        with:
          path: out/*.tar.xz
          archive: false
          if-no-files-found: error

      - name: Upload installer
        if: ${{ !inputs.warm-cache && runner.os == 'Windows' }}
        uses: actions/upload-artifact@v7
        with:
          path: out/*-setup.exe
          archive: false
          if-no-files-found: error
