# Tests for every pull request into main: the Rust workspace (`make test`) and the
# Python worker (`make test-worker`). Tests that need a real track stay #[ignore]d.

name: ci

on:
  pull_request:
    branches: [main]

# A new push to the same PR cancels the run still going for the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The same build packages as the release's Linux build.
      - name: Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libdbus-1-dev libpipewire-0.3-dev libclang-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev

      - name: Test
        run: cargo test --workspace --locked -- --test-threads=4

  worker:
    name: Worker tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # The tempo lock tests run ffmpeg and Rubber Band as programs.
      - name: Programs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg rubberband-cli

      - name: Install
        run: uv sync --locked

      - name: Test
        run: .venv/bin/python -m pytest -q
