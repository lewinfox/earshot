# Tests for every pull request into main or develop: the Rust workspace (`make test`) and the
# Python worker (`make test-worker`). Tests that need a real track stay #[ignore]d.
#
# The Rust tests are rust-tests.yml (Linux and macOS), the worker's worker-tests.yml.

name: ci

on:
  pull_request:
    branches: [main, develop]

# A new push to the same PR cancels the run still going for the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust tests
    uses: ./.github/workflows/rust-tests.yml

  worker:
    name: Worker tests
    uses: ./.github/workflows/worker-tests.yml
