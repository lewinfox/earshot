[project]
name = "earshot-worker"
version = "0.1.0"
description = "Stateless analysis worker for earshot (beatgrids via Beat This!)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "soundfile>=0.12",
    "librosa>=0.10",
    "beat_this>=1.1",
    # torchaudio (pulled in by beat_this) only loads against the torch release it was
    # built for, and torchaudio lags torch. Keep the two on the same minor version.
    "torch==2.11.*",
    "torchaudio==2.11.*",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["earshot_worker"]

# CPU-only torch: ~10x smaller than the CUDA build and plenty fast for analysis.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
