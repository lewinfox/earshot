[project]
name = "earshot-worker"
version = "0.1.0"
description = "Stateless analysis worker for earshot (beatgrids via Beat This!) and its reader for other DJ libraries (cratelib)"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "soundfile>=0.12",
    "librosa>=0.10",
    "beat_this>=1.1",
    # torchaudio (pulled in by beat_this) only loads against the torch release it was
    # built for, and torchaudio lags torch. Keep the two on the same minor version.
    "torch==2.11.*",
    "torchaudio==2.11.*",
    # Other DJ programs' libraries (earshot_worker/libraries.py); pinned to a commit
    # in [tool.uv.sources].
    "cratelib",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["earshot_worker"]

# CPU-only torch: ~10x smaller than the CUDA build and plenty fast for analysis.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]
# Bump `rev` to pick up cratelib changes.
cratelib = { git = "https://github.com/lewinfox/cratelib", rev = "7997d9f037860f4152c065c12aa06ebd725f5ca4" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
