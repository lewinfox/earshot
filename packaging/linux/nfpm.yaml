# The Linux packages (.deb and .rpm), made by packaging/linux/package.sh from a
# release folder (packaging/bundle.sh). The folder goes in /opt/earshot as it is; the
# app finds what it runs beside its binary, through the /usr/bin link
# (core/worker_env.rs). Removing the package removes all of it; what earshot keeps
# in the home folder (core/folders.rs) stays, as with any package.
#
# package.sh fills in the ${...} (nfpm itself doesn't expand them in every field).

name: earshot
arch: amd64
platform: linux
version: ${VERSION}
prerelease: ${PRERELEASE}
section: sound
priority: optional
maintainer: ${MAINTAINER}
homepage: https://github.com/lewinfox/earshot
# earshot is MIT; what comes with it (Rubber Band, mutagen in the worker, FFmpeg)
# brings the GPL and LGPL: /opt/earshot/licenses says which is which. (The rpm
# shows this; a .deb has no licence field, it has /usr/share/doc/earshot/copyright.)
license: MIT AND GPL-2.0-or-later AND LGPL-2.1-or-later
description: |-
  DJ library explorer and performance decks
  earshot analyses your music (beats, key, stems), organises it and plays it on
  up to four decks with a DJ controller. Everything it runs comes with it: its
  analysis worker with its own Python and models, ffmpeg and Rubber Band.

# What the binary links (readelf), and what the GUI loads as it starts (X11 or
# Wayland, the keyboard map, OpenGL). ${GLIBC} is the newest glibc anything in the
# folder needs, read from the binaries. PipeWire and ALSA took a t64 name in Ubuntu
# 24.04 / Debian 13.
depends:
  - libc6 (>= ${GLIBC})
  - libstdc++6
  - libgcc-s1
  - libdbus-1-3
  - libasound2t64 | libasound2
  - libpipewire-0.3-0t64 | libpipewire-0.3-0
  - libxkbcommon0
  - libegl1
  - libgl1
  - libwayland-client0
  - libwayland-cursor0
  - libwayland-egl1
  - libx11-6
  - libx11-xcb1
  - libxcursor1
  - libxi6
  - libxrandr2
# Real-time priority for the audio thread (asked for over D-Bus).
recommends:
  - rtkit

overrides:
  rpm:
    depends:
      - glibc >= ${GLIBC}
      - libstdc++
      - libgcc
      - dbus-libs
      - alsa-lib
      - pipewire-libs
      - libxkbcommon
      - libglvnd-egl
      - libglvnd-glx
      - libwayland-client
      - libwayland-cursor
      - libwayland-egl
      - libX11
      - libX11-xcb
      - libXcursor
      - libXi
      - libXrandr

# Modes are set for the files from the repo, which have the builder's umask.
contents:
  - src: ${BUNDLE}
    dst: /opt/earshot
    type: tree
  - src: /opt/earshot/earshot
    dst: /usr/bin/earshot
    type: symlink
  - src: ${DESKTOP}
    dst: /usr/share/applications/earshot.desktop
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/doc/earshot/copyright
    packager: deb
    file_info:
      mode: 0644
  - src: gui/assets/icons/earshot.svg
    dst: /usr/share/icons/hicolor/scalable/apps/earshot.svg
    file_info:
      mode: 0644
  - src: gui/assets/icons/earshot-16.png
    dst: /usr/share/icons/hicolor/16x16/apps/earshot.png
    file_info:
      mode: 0644
  - src: gui/assets/icons/earshot-24.png
    dst: /usr/share/icons/hicolor/24x24/apps/earshot.png
    file_info:
      mode: 0644
  - src: gui/assets/icons/earshot-32.png
    dst: /usr/share/icons/hicolor/32x32/apps/earshot.png
    file_info:
      mode: 0644
  - src: gui/assets/icons/earshot-48.png
    dst: /usr/share/icons/hicolor/48x48/apps/earshot.png
    file_info:
      mode: 0644
  - src: gui/assets/icons/earshot-64.png
    dst: /usr/share/icons/hicolor/64x64/apps/earshot.png
    file_info:
      mode: 0644
  - src: gui/assets/icons/earshot-128.png
    dst: /usr/share/icons/hicolor/128x128/apps/earshot.png
    file_info:
      mode: 0644
  - src: gui/assets/icons/earshot-256.png
    dst: /usr/share/icons/hicolor/256x256/apps/earshot.png
    file_info:
      mode: 0644
  - src: gui/assets/icons/earshot-512.png
    dst: /usr/share/icons/hicolor/512x512/apps/earshot.png
    file_info:
      mode: 0644

deb:
  compression: zstd
rpm:
  compression: zstd
